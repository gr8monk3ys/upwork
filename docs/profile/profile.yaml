overview: |
  I build AI-powered applications that make it to production: RAG systems, LLM integrations, and the full-stack web apps and data pipelines around them. Six years of professional software work, an M.S. in Applied Data Science (USC), and a 98% Job Success Score on Upwork.

  What I deliver:
  - RAG and LLM systems: document Q&A, chatbots, content generation, multi-provider LLM backends (OpenAI, Anthropic, Gemini), evaluation harnesses so retrieval quality is measured, not guessed
  - Full-stack web apps: Next.js/React/TypeScript front ends with FastAPI or Node backends, Postgres, auth (Clerk/NextAuth), Stripe billing, deployed on Vercel/GCP/AWS
  - Data engineering: ETL pipelines, streaming (Kafka/Spark), warehouse modeling, dashboards
  - Deployment: Docker, CI/CD, monitoring, Kubernetes when warranted

  Recent work:
  - ML Engineer at a Los Angeles startup (Sizzle, Jun 2024–May 2025): vision-AI pipeline on GCP Vertex AI serving 5k+ inference requests/day at <200 ms p95 for 10+ B2B clients; 50k-image labeling/augmentation workflow raised accuracy by 12 percentage points
  - Blog AI (open source, 56 GitHub stars): research → outline → per-section drafting → fact-check → SEO loop; Next.js + FastAPI, live with Clerk auth and Stripe billing
  - TAlker, a RAG teaching assistant: hybrid BM25 + vector retrieval, cross-encoder reranking, RAGAS-style evaluation, six LLM providers behind one interface
  - DOE Joint Genome Institute (2020–2021): genomics ETL cut from 4 hours to 10 minutes
  - Freelance on Upwork since Aug 2022: RAG document Q&A systems, classification dashboards, automated data pipelines for 4 clients

  How I work: a short written plan before code, a working deployment you can click on early, tests on the parts that matter, plain-English updates.
